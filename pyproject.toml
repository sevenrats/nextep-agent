[project]
name = "nextep-agent"
version = "0.1.0"
description = "Pull-based, self-renewing certificate agent for smallhelp (x5c + ACME DNS-01)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.3",
    "uvicorn>=0.44.0",
    "uvloop",
    "httpx>=0.28.1",
    "apscheduler>=3.10",
    "acmeow",
    "dns-lexicon",
    "pyjwt",
    "cryptography",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Silence only THIRD-PARTY deprecation noise we cannot fix from our own code,
# pinned as narrowly as possible. Our code already uses the non-deprecated entry
# points in both cases:
#   - dns-lexicon deprecates its own internal submodules ahead of a Lexicon 4
#     that is not yet released (we import lexicon.client/config/exceptions).
#   - fastapi's TestClient still rides classic httpx (revisit when it adopts
#     httpx2); this warning is test-only.
filterwarnings = [
    "ignore:Module lexicon\\..* is deprecated:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nextep_agent*"]
